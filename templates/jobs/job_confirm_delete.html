{% extends 'base.html' %}

{% block title %}Delete Job - Charlady{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-md">
    <div class="bg-white rounded-2xl shadow-xl border border-pink-100 p-8 text-center">
        <h1 class="text-2xl md:text-3xl font-bold text-pink-700 mb-6">Confirm Deletion</h1>

        <p class="text-lg text-gray-700 mb-8">
            Are you sure you want to delete the job listing<br>
            <span class="font-semibold text-pink-600">"{{ job.title }}"</span>?
        </p>

        <p class="text-red-600 font-medium mb-8">
            This action cannot be undone.
        </p>

        <form method="post" class="flex flex-col sm:flex-row gap-4 justify-center">
            {% csrf_token %}
            <a href="{% url 'jobs:job_detail' job.pk %}"
                class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-8 rounded-xl transition">
                Cancel
            </a>
            <button type="submit"
                class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-xl transition focus:outline-none focus:ring-4 focus:ring-red-300">
                Yes, Delete Job
            </button>
        </form>
    </div>
</div>
{% endblock %}
