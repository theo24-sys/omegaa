{% extends 'base.html' %}
{% block title %}Reset Password - CHARLADY{% endblock %}
{% block content %}
<div class="container mx-auto max-w-md px-4 py-12">
  <div class="page-panel p-6 md:p-8">
    <h1 class="text-3xl font-bold text-pink-700 mb-3">Reset your password</h1>
    <p class="text-gray-600 mb-6">Enter your email address and we will send a reset link.</p>
    <form method="post" data-submit-state data-loading-text="Sending link..." class="space-y-5">
      {% csrf_token %}
      {{ form.email.errors }}
      <label class="block font-medium text-gray-700" for="id_email">Email address</label>
      {{ form.email }}
      <button class="w-full rounded-xl bg-pink-600 px-4 py-3 font-bold text-white" type="submit">Send reset link</button>
    </form>
  </div>
</div>
{% endblock %}
