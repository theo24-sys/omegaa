<div id="unread-count-container" hx-get="{% url 'notifications:unread_count_badge' %}" hx-trigger="every 10s" hx-swap="outerHTML">
    <a href="{% url 'notifications:notification_list' %}" class="relative hover:text-pink-100 transition">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        {% if unread_count > 0 %}
        <span
            class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">
            {{ unread_count }}
        </span>
        {% endif %}
    </a>
</div>
